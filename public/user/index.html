<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institute Pass Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="user-portal-container">
        <header class="portal-header">
            <div class="logo">
                <i class="fa-solid fa-shield-halved"></i>
                <span>SecurGate</span>
            </div>
            <h1>Self-Service Pass Portal</h1>
            <p>Generate your secure campus access pass</p>
        </header>

        <main class="portal-main">
            <!-- Issue Pass View -->
            <section id="view-passes" class="card">
                <h2>Registration Form</h2>
                <form id="pass-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="pass-name" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label>ID / Roll Number</label>
                            <input type="text" id="pass-idNumber" required placeholder="ID12345">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Pass Type</label>
                            <select id="pass-type">
                                <option value="visitor">Visitor (Blue)</option>
                                <option value="student">Student (Green)</option>
                                <option value="labourer">Labourer (Orange)</option>
                                <option value="chief_guest">Chief Guest (Gold)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Contact Number</label>
                            <input type="text" id="pass-contact" placeholder="1234567890">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Organization / Class</label>
                        <input type="text" id="pass-org" placeholder="e.g. ABC Corp">
                    </div>
                    <div class="form-group">
                        <label>Purpose of Visit</label>
                        <input type="text" id="pass-purpose" placeholder="e.g. Meeting">
                    </div>
                    
                    <button type="submit" class="btn-primary w-100 mt-2">Generate My Pass</button>
                </form>
            </section>

            <!-- Pass Preview Modal -->
            <div id="pass-preview" class="card hidden">
                <h2 style="color: var(--status-green);"><i class="fa-solid fa-circle-check"></i> Pass Generated Successfully</h2>
                <p style="color: var(--text-muted); text-align: center; margin-bottom: 20px;">Please show this QR code at the entry/exit gates.</p>
                <div class="pass-card" id="generated-pass-card">
                    <div class="pass-header">
                        <h3 id="card-type">Visitor Pass</h3>
                    </div>
                    <div class="pass-body">
                        <div class="qr-container" id="qrcode"></div>
                        <div class="pass-details">
                            <h4 id="card-name">John Doe</h4>
                            <p id="card-id">ID12345</p>
                            <p id="card-org">ABC Corp</p>
                        </div>
                    </div>
                </div>
                <div class="form-row mt-2">
                    <button class="btn-secondary" onclick="window.print()">Print Pass</button>
                    <button class="btn-secondary" onclick="location.reload()">Create Another</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
